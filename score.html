<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MadGolf — Score Entry</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* COPIED-CSS from index.html by pages.py - do not edit here */
:root {
  --g900:#0d1f0d; --g800:#1a2f1a;
  --g700:#243824; --g600:#2e472e;
  --gold:#c9a227; --gold2:#e8c04a;
  --surf:#fff;
  --surf2:#f4f4f2;
  --surf3:#e8e8e5;
  --red:#c0392b;
  --blue:#2471a3;
  --text:#1a1a1a;
  --muted:#777;
  --radius:10px;
  --shadow:0 2px 12px rgba(0,0,0,0.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
header{
  background:var(--g800);
  color:#fff;
  position:sticky;top:0;
  z-index:100;
  box-shadow:0 2px 8px rgba(0,0,0,0.3);
  flex-shrink:0;
}
.hdr-inner{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px 10px;
  max-width:480px;margin:0 auto;
}
.hdr-left{display:flex;align-items:center;gap:10px;}
.hdr-logo{height:40px;width:40px;object-fit:contain;border-radius:6px;}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--gold);}
.hdr-sub{font-size:11px;color:rgba(255,255,255,0.5);margin-top:1px;font-weight:500;}
.card{
  background:var(--surf);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
  box-shadow:var(--shadow);
}
.hole-grid{display:grid;gap:3px;margin-bottom:6px;}
.hole-cell{text-align:center;font-size:11px;padding:4px 1px;border-radius:4px;background:var(--surf2);}
.hole-cell.header{font-weight:700;font-size:10px;color:var(--muted);background:none;}
.hole-cell.total{font-weight:700;font-size:11px;background:var(--surf2);}
.hole-cell.par-cell{font-weight:600;}
.game-score-input{width:100%;border:none;border-bottom:1.5px solid var(--surf3);background:transparent;text-align:center;font-size:12px;padding:3px 1px;font-family:'DM Sans',sans-serif;outline:none;}
.game-score-input:focus{border-bottom-color:var(--gold);}
/* END COPIED-CSS */
/* This page only. The scorecard itself is the app's (above). */
body{font-family:'DM Sans',sans-serif;background:var(--surf2);color:var(--text);padding-top:env(safe-area-inset-top);}
.wrap{max-width:520px;margin:0 auto;padding:12px 10px 40px;}
.evt{text-align:center;margin:4px 0 10px;}
.evt .t{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:var(--g800);}
.evt .s{font-size:12px;color:var(--muted);}
.saved{text-align:center;font-size:12px;color:var(--muted);height:16px;margin-top:6px;}
.msg{color:var(--muted);text-align:center;padding:44px 12px;line-height:1.5;}
.hint{font-size:11px;color:var(--muted);text-align:center;margin-top:8px;}
</style>
</head>
<body>
<header>
  <div class="hdr-inner">
    <div class="hdr-left">
      <img class="hdr-logo" src="logo.webp" alt="MadGolf" onerror="this.style.display='none'">
      <div><div class="hdr-title">MadGolf</div><div class="hdr-sub">Live scoring</div></div>
    </div>
  </div>
</header>
<div class="wrap">
  <div class="evt"><div class="t" id="title">Score Entry</div><div class="s" id="sub"></div></div>
  <div class="card" style="padding:10px;"><div id="app"></div></div>
  <div class="saved" id="saved"></div>
  <div class="hint">Type a score in a box; it saves and moves to the next.</div>
</div>
<script>
/* COPIED-JS from index.html by pages.py - do not edit here */
const GROUP_COLORS  = ['#e8f5e9','#e3f2fd','#fff9e6','#fce4ec','#f3e5f5','#e0f7fa'];
const GROUP_BORDERS = ['#27ae60','#2471a3','#c9a227','#e91e63','#9c27b0','#00bcd4'];
function esc(str) {
  return String(str || '').replace(/[<>"'&]/g, '').trim().slice(0, 100);
}
function lastNameOf(n) {
  const s = (n || '').trim();
  if (s.includes(',')) return s.split(',')[0].trim().toLowerCase();
  const p = s.split(' ');
  return p[p.length - 1].toLowerCase();
}
function firstNameOf(n) {
  const s = (n || '').trim();
  if (s.includes(',')) { const f = s.split(',')[1]; return f ? f.trim().split(' ')[0] : ''; }
  return s.split(' ')[0];
}
function scorecardName(player, groupPlayers) {
  const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  const last = lastNameOf(player.name);
  if (!last) return player.name || '?';
  const sameLastName = groupPlayers.filter(p => p.id !== player.id && lastNameOf(p.name) === last);
  if (!sameLastName.length) return cap(last);
  const first = firstNameOf(player.name) || '';
  const sameInitial = sameLastName.filter(p => (firstNameOf(p.name)||'')[0]?.toLowerCase() === first[0]?.toLowerCase());
  if (!sameInitial.length) return cap(last) + (first ? ', ' + first[0].toUpperCase() + '.' : '');
  return cap(last) + (first ? ', ' + first : '');
}
function strokesOnHole(courseHcp, holeHcpRating, hcpScale) {
  const mod = hcpScale || 18;
  if (courseHcp >= 0) {
    return Math.floor(courseHcp / mod) + (holeHcpRating <= courseHcp % mod ? 1 : 0);
  } else {
    const a = Math.abs(courseHcp);
    return -(Math.floor(a / mod) + (holeHcpRating > mod - a % mod ? 1 : 0));
  }
}
function scoreCell(value, strokes, pidAttr, pid, holeNum, handler) {
  const bg  = strokes > 0 ? 'background:#fde8e8;' : strokes < 0 ? 'background:#e8f4ec;' : '';
  const dot = strokes > 0
    ? `<span style="position:absolute;top:1px;right:2px;color:#c0392b;font-size:8px;">${'\u2022'.repeat(Math.min(strokes,3))}</span>`
    : strokes < 0
    ? `<span style="position:absolute;top:1px;right:2px;color:#27ae60;font-size:8px;">${'\u2022'.repeat(Math.min(Math.abs(strokes),3))}</span>`
    : '';
  // No handler = a card to READ (History). It used to stay typeable, and the
  // foursome handler writes to the game IN PROGRESS, so a tap on a finished
  // card changed the live game (found by the walk, 2026-10-03).
  const entry = handler ? `oninput="${handler}"` : 'readonly tabindex="-1"';
  return `<div class="hole-cell" style="position:relative;padding:0;${bg}"><input type="text" inputmode="numeric" maxlength="1" value="${value}" ${pidAttr}="${pid}" data-hole="${holeNum}" ${entry} class="game-score-input">${dot}</div>`;
}
function scorecardHdr(holes, lbl, totLbl, nameColW, totColW, hcpRow) {
  const nw   = nameColW || '80px';
  const tw   = totColW  || '36px';
  const cols = `${nw} repeat(${holes.length},1fr) ${tw}`;
  const parTot = holes.reduce((a, h) => a + h.par, 0);
  let out = `
    <div class="hole-grid" style="grid-template-columns:${cols};">
      <div class="hole-cell" style="background:var(--g800);color:rgba(255,255,255,.5);font-size:9px;font-weight:700;">${lbl}</div>
      ${holes.map(h => `<div class="hole-cell" style="background:var(--g800);color:var(--gold);font-size:10px;font-weight:700;">${h.num}</div>`).join('')}
      <div class="hole-cell" style="background:var(--g800);color:rgba(255,255,255,.5);font-size:9px;font-weight:700;">${totLbl}</div>
    </div>
    <div class="hole-grid" style="grid-template-columns:${cols};">
      <div class="hole-cell header">Par</div>
      ${holes.map(h => `<div class="hole-cell par-cell">${h.par}</div>`).join('')}
      <div class="hole-cell total">${parTot}</div>
    </div>`;
  if (hcpRow) {
    out += `
    <div class="hole-grid" style="grid-template-columns:${cols};">
      <div class="hole-cell header" style="color:var(--muted);">HCP</div>
      ${holes.map(h => `<div class="hole-cell" style="font-size:10px;color:var(--muted);">${h.hcp || ''}</div>`).join('')}
      <div class="hole-cell"></div>
    </div>`;
  }
  return out;
}
function renderScorecardGroup(ctx, gi, grp, opts) {
  const { players, activeHoles, hcpScale, scores, format } = ctx;
  const gp      = grp.playerIds.map(id => players.find(p => p.id === id)).filter(Boolean);
  if (!gp.length) return '';
  const rowA    = activeHoles.slice(0, 9);
  const rowB    = activeHoles.slice(9);
  const isScram = format === 'scramble';
  const col     = GROUP_COLORS[gi % 6];
  const brd     = GROUP_BORDERS[gi % 6];
  const o       = opts || {};
  const pidAttr = o.pidAttr  || 'data-pid';
  const grpAttr = o.grpAttr  || 'data-grpkey';
  const onInput = o.onInput  || '';
  const onTeam  = o.onTeam   || 'outingUpdateTeamScore(this)';
  const pfxA    = o.pfxA     || 'out_A_';
  const pfxB    = o.pfxB     || 'out_B_';
  const pfxT    = o.pfxT     || 'out_tot_';
  const chLabelFn = o.chLabel || (pp => (pp.teeColor?`<span style="font-size:8px;color:var(--gold);font-weight:700;">${esc(pp.teeColor)}</span> `:'') + '<span style="color:var(--muted);font-weight:400;font-size:9px;">CH' + pp.courseHcp + '</span>');
  const hcpRow  = o.hcpRow  || false;

  function playerRow(p, holes, secPfx) {
    const sc   = scores[p.id] || {};
    const tot  = holes.reduce((a, h) => a + (parseInt(sc[h.num]) || 0), 0);
    const cols = `80px repeat(${holes.length},1fr) 36px`;
    const displayName = scorecardName(p, gp);
    return `<div class="hole-grid" style="grid-template-columns:${cols};">
      <div class="hole-cell header" style="text-align:left;padding-left:4px;line-height:1.2;white-space:normal;overflow:hidden;">
        ${esc(displayName)}
        <br>${chLabelFn(p)}
      </div>
      ${holes.map(h => scoreCell(sc[h.num] != null ? sc[h.num] : '', strokesOnHole(p.courseHcp, h.hcpRating||0, hcpScale), pidAttr, p.id, h.num, onInput)).join('')}
      <div class="hole-cell total" id="${secPfx}${p.id}">${tot||''}</div>
    </div>`;
  }

  function scramRow(key, holes, secPfx) {
    const sc  = scores[key] || {};
    const tot = holes.reduce((a,h) => a+(parseInt(sc[h.num])||0), 0);
    const cols = `80px repeat(${holes.length},1fr) 36px`;
    return `<div class="hole-grid" style="grid-template-columns:${cols};">
      <div class="hole-cell header" style="text-align:left;padding-left:4px;line-height:1.2;">
        TEAM<br><span style="color:var(--muted);font-weight:400;font-size:9px;">Gross</span>
      </div>
      ${holes.map(h => {
        const v = sc[h.num] != null ? sc[h.num] : '';
        return `<div class="hole-cell" style="padding:0;">
          <input type="text" inputmode="numeric" maxlength="1" value="${v}"
            ${grpAttr}="${key}" data-hole="${h.num}" oninput="${onTeam}"
            class="game-score-input">
        </div>`;
      }).join('')}
      <div class="hole-cell total" id="${secPfx}${key}">${tot||''}</div>
    </div>`;
  }

  const key   = `grp_${gi}`;
  const names = gp.map(p => esc(p.name)).join(', ');
  const extraHtml = o.extraInfo
    ? `<span style="font-family:'DM Sans',sans-serif;font-size:11px;font-weight:400;opacity:.7;margin-left:8px;">${o.extraInfo}</span>`
    : '';

  const frontRows = isScram ? scramRow(key, rowA, pfxA) : gp.map(p => playerRow(p, rowA, pfxA)).join('');
  const backRows  = rowB.length ? (isScram ? scramRow(key, rowB, pfxB) : gp.map(p => playerRow(p, rowB, pfxB)).join('')) : '';

  let totalsHtml;
  if (isScram) {
    const sc  = scores[key] || {};
    const tot = activeHoles.reduce((a,h)=>a+(parseInt(sc[h.num])||0),0);
    totalsHtml = `<div style="display:flex;justify-content:space-between;font-size:12px;">
      <span style="font-weight:600;">Team Gross</span>
      <span style="font-weight:700;color:var(--g800);" id="${pfxT}${key}">${tot||'\u2014'}</span>
    </div>`;
  } else {
    totalsHtml = gp.map(p => {
      const sc  = scores[p.id] || {};
      const tot = activeHoles.reduce((a,h)=>a+(parseInt(sc[h.num])||0),0);
      return `<div style="display:flex;justify-content:space-between;font-size:12px;padding:1px 0;">
        <span style="font-weight:600;">${esc(p.name)}</span>
        <span style="font-weight:700;color:var(--g800);">Total: <span id="${pfxT}${p.id}">${tot||'\u2014'}</span></span>
      </div>`;
    }).join('');
  }

  return `<div style="margin-bottom:20px;">
    <div style="font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:1px;color:var(--g800);
         padding:8px 12px;background:${col};border-left:4px solid ${brd};border-radius:6px 6px 0 0;text-align:center;">
      ${esc(grp.label)}
      <span style="font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:0;margin-left:6px;">${names}</span>
      ${extraHtml}
    </div>
    <div style="border:1px solid var(--surf3);border-top:none;border-radius:0 0 8px 8px;overflow:hidden;padding:6px;">
      ${scorecardHdr(rowA, rowB.length?'FRONT':'HOLES', rowB.length?'OUT':'TOT', null, null, hcpRow)}
      ${frontRows}
      ${rowB.length?`<div style="border-top:2px solid var(--surf3);padding-top:4px;margin-top:4px;">
        ${scorecardHdr(rowB,'BACK','IN', null, null, hcpRow)}${backRows}
      </div>`:''}
      <div style="border-top:2px solid var(--surf3);padding:6px 4px;margin-top:4px;">${totalsHtml}</div>
    </div>
  </div>`;
}
function buildScoringIndex(container, selector, mode) {
  selector = selector || '.game-score-input';
  const inputs = Array.from(container.querySelectorAll(selector));
  // mode: 'live'=hole-major (advance by hole, all players), 'post'=player-major (all holes, then next player)
  mode = mode || 'post';
  let ordered;
  if (mode === 'live') {
    // Hole-major: group by hole number, all players per hole in DOM order
    const byHole = {};
    inputs.forEach(inp => {
      const h = inp.dataset.hole || inp.dataset.grpkey || '0';
      if (!byHole[h]) byHole[h] = [];
      byHole[h].push(inp);
    });
    ordered = Object.keys(byHole).map(Number).sort((a,b)=>a-b).flatMap(h => byHole[h]);
  } else {
    // Player-major: DOM order (each scorecard renders player rows already)
    ordered = inputs;
  }
  window._fsHoleMajorIdx = ordered; // keeps fsUpdateGameScore working
  return ordered;
}
function advanceToNext(input, ordered) {
  const idx = ordered.indexOf(input);
  if (idx < 0) return;
  for (let i = idx + 1; i < ordered.length; i++) {
    const v = parseInt(ordered[i].value);
    if (isNaN(v) || v < 1) {
      setTimeout(() => { ordered[i].focus({ preventScroll:true }); ordered[i].select(); }, 50);
      return;
    }
  }
}
/* END COPIED-JS */

/* This page only: load the shared round, sign in anonymously, and save each
   score the moment it is typed. The card is the app's renderScorecardGroup,
   so it looks, totals and places stroke dots exactly as the app does. */
const API_KEY = 'AIzaSyDk1_QEihU-02Fyzs5LUYRNjcpmBYsRnCM';
const DB = 'https://madgolf-c8789-default-rtdb.firebaseio.com/bz-apps/golf/live';
const params = new URLSearchParams(location.search);
const id = params.get('id'), gi = parseInt(params.get('g'), 10);
let _token = null, _data = null, _group = null, _scores = {}, _order = [];

function msg(html) { document.getElementById('app').innerHTML = '<div class="msg">' + html + '</div>'; }

async function anonToken() {
  const r = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + API_KEY,
    { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ returnSecureToken:true }) });
  const d = await r.json();
  if (!d.idToken) throw new Error(d.error ? d.error.message : 'auth failed');
  return d.idToken;
}

async function boot() {
  if (!id || !(gi >= 0)) { msg('This scoring link is incomplete.'); return; }
  try {
    const res = await fetch(DB + '/' + encodeURIComponent(id) + '.json', { cache:'no-store' });
    _data = await res.json();
    if (!_data || !_data.course || !_data.groups) { msg('This event is not available or not shared.'); return; }
    _group = (_data.groups || [])[gi];
    if (!_group) { msg('Group not found for this link.'); return; }
    try { const sr = await fetch(DB + '/' + encodeURIComponent(id) + '/scores.json', { cache:'no-store' }); _scores = (await sr.json()) || {}; } catch (e) { _scores = {}; }
    try { _token = await anonToken(); } catch (e) { msg('Could not start scoring (sign-in). Ask the organizer to check anonymous sign-in.'); return; }
    document.getElementById('title').textContent = _data.title || 'Score Entry';
    document.getElementById('sub').textContent = (_group.label || 'Your group') + ' · ' + (_data.course.name || '');
    render();
  } catch (e) { msg('Could not load. Check the link and your connection.'); }
}

/* The round as the app's scorecard wants it: the holes PLAYED (re-ranked on a
   nine), each player's course handicap, the stroke scale, the format. */
function ctxNow() {
  const c = _data.course;
  const holes = (c.holes || []).map(h => Object.assign({}, h, { hcpRating: h.hcpRating != null ? h.hcpRating : (h.hcp || 0) }));
  return {
    players: (_group.players || []).map(p => ({ id: p.id, name: p.name, courseHcp: p.ch || 0 })),
    activeHoles: holes, hcpScale: c.hcpScale || holes.length || 18,
    scores: _scores, format: _data.format || 'stroke'
  };
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = renderScorecardGroup(ctxNow(), gi,
    { playerIds: (_group.players || []).map(p => p.id), label: _group.label },
    { pidAttr: 'data-pid', grpAttr: 'data-grpkey', onInput: 'scInput(this)', onTeam: 'scInput(this)',
      hcpRow: true, pfxA: 'A_', pfxB: 'B_', pfxT: 'T_' });
  _order = buildScoringIndex(app, '.game-score-input', 'live');   // hole by hole, as the app's By Hole
  const first = _order.find(i => !i.value);
  if (first) first.focus({ preventScroll: true });
}

/* One digit, 1-9, as the app's own score boxes take it. */
function scInput(el) {
  const raw = el.value.replace(/[^1-9]/g, '').slice(0, 1);
  if (el.value !== raw) el.value = raw;
  const key = el.dataset.pid || el.dataset.grpkey, hole = el.dataset.hole;
  const v = raw ? parseInt(raw, 10) : null;
  _scores[key] = _scores[key] || {};
  if (v == null) delete _scores[key][hole]; else _scores[key][hole] = v;
  totals(key);
  save(key, hole, v);
  if (v != null) advanceToNext(el, _order);
}

/* The row totals in place: front, back, whole round (the card's own ids). */
function totals(key) {
  const holes = ctxNow().activeHoles, sc = _scores[key] || {};
  const sum = hs => hs.reduce((a, h) => a + (parseInt(sc[h.num]) || 0), 0);
  const set = (eid, n) => { const e = document.getElementById(eid); if (e) e.textContent = n || (eid.indexOf('T_') === 0 ? '—' : ''); };
  set('A_' + key, sum(holes.slice(0, 9)));
  set('B_' + key, sum(holes.slice(9)));
  set('T_' + key, sum(holes));
}

async function save(key, hole, v) {
  flash('Saving…');
  try {
    const r = await fetch(DB + '/' + encodeURIComponent(id) + '/scores/' + encodeURIComponent(key) + '/' + hole + '.json?auth=' + _token,
      { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(v) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    flash('Saved ✓');
  } catch (e) { flash('Not saved - check your signal and type it again'); }
}
let _flashT = null;
function flash(t) {
  const el = document.getElementById('saved'); el.textContent = t;
  if (_flashT) clearTimeout(_flashT);
  _flashT = setTimeout(() => { el.textContent = ''; }, 1800);
}

window.scInput = scInput;
boot();
</script>
</body>
</html>

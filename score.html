<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MadGolf — Live</title>
<!-- One page for everyone now (BZ, 2026-10-05): live.html. An old per-group
     scoring link lands here and goes on, keeping its round and its group. -->
<script>
  (function () {
    var p = new URLSearchParams(location.search);
    var q = 'id=' + encodeURIComponent(p.get('id') || '') + (p.get('g') != null ? '&g=' + encodeURIComponent(p.get('g')) : '');
    location.replace('live.html?' + q);
  })();
</script>
</head>
<body><p style="font-family:sans-serif;text-align:center;padding:40px;"><a href="live.html">Open the round</a></p></body>
</html>

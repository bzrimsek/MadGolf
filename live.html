<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MadGolf — Live Standings</title>
<style>
  :root { --bg:#12261a; --surf:#1b3527; --surf2:#24402f; --fg:#f0f4f0; --muted:#9fb3a5; --gold:#e0b64a; --line:#2e4a38; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; padding:22px 16px 48px; }
  h1 { font-size:22px; margin:0 0 2px; letter-spacing:.5px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:6px; }
  .live { display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--gold); font-weight:700; letter-spacing:.5px; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--gold); animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.25;} }
  table { width:100%; border-collapse:collapse; margin-top:14px; }
  td,th { padding:10px 6px; border-bottom:1px solid var(--line); text-align:left; }
  th { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .pos { width:36px; text-align:center; color:var(--muted); }
  .name { font-weight:600; }
  .pri { text-align:right; font-weight:700; color:var(--gold); font-size:15px; }
  .sec { text-align:right; color:var(--muted); font-size:12px; width:64px; }
  .upd { color:var(--muted); font-size:11px; margin-top:16px; text-align:center; }
  .msg { color:var(--muted); text-align:center; padding:44px 12px; line-height:1.5; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Live Standings</h1>
  <div class="sub" id="sub"></div>
  <div class="live"><span class="dot"></span>LIVE</div>
  <div id="board"></div>
  <div class="upd" id="upd"></div>
</div>
<script>
  const DB = 'https://madgolf-c8789-default-rtdb.firebaseio.com/bz-apps/golf/live';
  const id = new URLSearchParams(location.search).get('id');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  const medal = p => p === 1 ? '\uD83E\uDD47' : p === 2 ? '\uD83E\uDD48' : p === 3 ? '\uD83E\uDD49' : esc(p);

  async function load() {
    if (!id) { msg('No standings id in this link.'); return; }
    try {
      const res = await fetch(DB + '/' + encodeURIComponent(id) + '.json', { cache: 'no-store' });
      const d = await res.json();
      if (!d) { msg('These standings are not available &mdash; they may not be shared, or sharing was stopped.'); return; }
      render(d);
    } catch (e) {
      const u = document.getElementById('upd'); if (u) u.textContent = 'Reconnecting\u2026';
    }
  }
  function msg(html) { document.getElementById('board').innerHTML = '<div class="msg">' + html + '</div>'; }
  function render(d) {
    document.getElementById('title').textContent = d.title || 'Live Standings';
    document.getElementById('sub').textContent = d.sub || '';
    const rows = (d.rows || []).map(r =>
      '<tr><td class="pos">' + medal(r.pos) + '</td><td class="name">' + esc(r.name) +
      '</td><td class="pri">' + esc(r.primary) + '</td><td class="sec">' + esc(r.secondary || '') + '</td></tr>'
    ).join('');
    document.getElementById('board').innerHTML = rows
      ? '<table><tbody>' + rows + '</tbody></table>'
      : '<div class="msg">No scores posted yet.</div>';
    if (d.updated) document.getElementById('upd').textContent = 'Updated ' + new Date(d.updated).toLocaleTimeString();
  }

  load();
  setInterval(load, 10000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>

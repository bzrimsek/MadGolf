<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MadGolf — Live</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* COPIED-CSS from index.html by pages.py - do not edit here */
:root {
  --g900:#0d1f0d; --g800:#1a2f1a;
  --g700:#243824; --g600:#2e472e;
  --gold:#c9a227; --gold2:#e8c04a;
  --surf:#fff;
  --surf2:#f4f4f2;
  --surf3:#e8e8e5;
  --red:#c0392b;
  --blue:#2471a3;
  --text:#1a1a1a;
  --muted:#777;
  --radius:10px;
  --shadow:0 2px 12px rgba(0,0,0,0.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
header{
  background:var(--g800);
  color:#fff;
  position:sticky;top:0;
  z-index:100;
  box-shadow:0 2px 8px rgba(0,0,0,0.3);
  flex-shrink:0;
}
.hdr-inner{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px 10px;
  max-width:480px;margin:0 auto;
}
.hdr-left{display:flex;align-items:center;gap:10px;}
.hdr-logo{height:40px;width:40px;object-fit:contain;border-radius:6px;}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--gold);}
.hdr-sub{font-size:11px;color:rgba(255,255,255,0.5);margin-top:1px;font-weight:500;}
.card{
  background:var(--surf);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
  box-shadow:var(--shadow);
}
.hole-grid{display:grid;gap:3px;margin-bottom:6px;}
.hole-cell{text-align:center;font-size:11px;padding:4px 1px;border-radius:4px;background:var(--surf2);}
.hole-cell.header{font-weight:700;font-size:10px;color:var(--muted);background:none;}
.hole-cell.total{font-weight:700;font-size:11px;background:var(--surf2);}
.hole-cell.par-cell{font-weight:600;}
.game-score-input{width:100%;border:none;border-bottom:1.5px solid var(--surf3);background:transparent;text-align:center;font-size:12px;padding:3px 1px;font-family:'DM Sans',sans-serif;outline:none;}
.game-score-input:focus{border-bottom-color:var(--gold);}
.holes-toggle{padding:8px 14px;border-radius:8px;border:1.5px solid var(--surf3);background:var(--surf2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
.holes-toggle.active{background:var(--g800);color:var(--gold);border-color:var(--g800);}
/* END COPIED-CSS */
/* This page only. ONE page for everyone in a round (BZ, 2026-10-05, after
   Golf Genius: the link gets you in, you pick your name from a list, then you
   have Scorecard and Leaderboard tabs). */
body{font-family:'DM Sans',sans-serif;background:var(--surf2);color:var(--text);padding-top:env(safe-area-inset-top);}
.wrap{max-width:560px;margin:0 auto;padding:12px 10px 40px;}
.evt{text-align:center;margin:4px 0 8px;}
.evt .t{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;color:var(--g800);}
.evt .s{font-size:12px;color:var(--muted);}
.live{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--gold);font-weight:700;letter-spacing:.5px;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 1.6s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
.upd,.hint{color:var(--muted);font-size:11px;margin-top:8px;text-align:center;}
.saved{text-align:center;font-size:12px;color:var(--muted);height:16px;margin-top:6px;}
.msg{color:var(--muted);text-align:center;padding:36px 12px;line-height:1.5;}
.who-h{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:var(--g800);text-align:center;margin-bottom:8px;}
.who-g{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-align:center;padding:10px 0 4px;}
.who-p{display:block;width:100%;padding:12px;margin:0 0 6px;border:1.5px solid var(--surf3);border-radius:8px;background:var(--surf);
  font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;color:var(--g800);cursor:pointer;text-align:center;}
.who-p:active{background:var(--surf2);}
.who-w{display:block;width:100%;padding:12px;margin-top:10px;border:none;background:none;color:var(--muted);font-size:13px;
  font-family:'DM Sans',sans-serif;cursor:pointer;text-decoration:underline;}
.link{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;font-family:'DM Sans',sans-serif;}
</style>
</head>
<body>
<header>
  <div class="hdr-inner">
    <div class="hdr-left">
      <img class="hdr-logo" src="logo.webp" alt="MadGolf" onerror="this.style.display='none'">
      <div><div class="hdr-title">MadGolf</div><div class="hdr-sub" id="hsub">Live</div></div>
    </div>
    <span class="live"><span class="dot"></span>LIVE</span>
  </div>
</header>
<div class="wrap">
  <div class="evt"><div class="t" id="title">Live</div><div class="s" id="sub"></div></div>
  <div id="tabs" class="mgb-tabs"></div>
  <div id="whoPane" style="display:none;"><div class="card" style="padding:12px;" id="who"></div></div>
  <div id="cardPane" style="display:none;">
    <div class="card" style="padding:10px;"><div id="app"></div></div>
    <div class="saved" id="saved"></div>
    <div class="hint">Type a score in a box; it saves and moves to the next.
      <button class="link" onclick="notMe()">Not you?</button></div>
  </div>
  <div id="boardPane" style="display:none;">
    <div class="card" style="padding:12px;"><div id="board"></div></div>
    <div class="upd" id="upd"></div>
  </div>
</div>
<script src="board.js"></script>
<script>
/* COPIED-JS from index.html by pages.py - do not edit here */
const GROUP_COLORS  = ['#e8f5e9','#e3f2fd','#fff9e6','#fce4ec','#f3e5f5','#e0f7fa'];
const GROUP_BORDERS = ['#27ae60','#2471a3','#c9a227','#e91e63','#9c27b0','#00bcd4'];
const TEAM_FORMATS = new Set(['scramble','shamble','twoBestBall','threeTwoOne','best2','321']);
const COMP_FORMATS = new Set(['stroke','stableford','scramble','shamble','twoBestBall','threeTwoOne','best2','321']);
function esc(str) {
  return String(str || '').replace(/[<>"'&]/g, '').trim().slice(0, 100);
}
function lastNameOf(n) {
  const s = (n || '').trim();
  if (s.includes(',')) return s.split(',')[0].trim().toLowerCase();
  const p = s.split(' ');
  return p[p.length - 1].toLowerCase();
}
function firstNameOf(n) {
  const s = (n || '').trim();
  if (s.includes(',')) { const f = s.split(',')[1]; return f ? f.trim().split(' ')[0] : ''; }
  return s.split(' ')[0];
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function roundHalfAwayZero(x) {
  return x >= 0 ? Math.floor(x + 0.5) : Math.ceil(x - 0.5);
}
function roundHalfUp1dp(x) {
  return Math.floor(x * 10 + 0.5) / 10;
}
function calcRawCourseHcp(hcpIdx, slope, rating, par, nineHole) {
  /* NINE HOLES PLAY OFF HALF THE INDEX, always (WHS; BZ, 2026-10-05: "the
     issue needs resolved"). The rating says which course it is: an 18-hole
     rating (>= 50) is halved for the nine played; a 9-hole course's own
     rating is used as is. The index used to be halved only in the first case,
     so a 10.0 at a 9-hole course played off 9 instead of 4. */
  let idx = hcpIdx, r = rating;
  if (nineHole) { idx = roundHalfUp1dp(hcpIdx / 2); if (rating >= 50) r = rating / 2; }
  return idx * (slope / 113) + (r - par);
}
function calcCourseHcp(hcpIdx, slope, rating, par, nineHole) {
  return roundHalfAwayZero(calcRawCourseHcp(hcpIdx, slope, rating, par, nineHole));
}
function coursePar(course) {
  if (course && course.holes && course.holes.length) return course.holes.reduce((a, h) => a + (h.par || 0), 0);
  return (course && course.par) || 72;
}
function strokesOnHole(courseHcp, holeHcpRating, hcpScale) {
  const mod = hcpScale || 18;
  if (courseHcp >= 0) {
    return Math.floor(courseHcp / mod) + (holeHcpRating <= courseHcp % mod ? 1 : 0);
  } else {
    const a = Math.abs(courseHcp);
    return -(Math.floor(a / mod) + (holeHcpRating > mod - a % mod ? 1 : 0));
  }
}
function calcPlayingHcp(raw, adjPct) {
  const adj = (adjPct || 100) / 100;
  if (raw < 0) return roundHalfAwayZero(roundHalfAwayZero(raw) * adj);
  return roundHalfAwayZero(raw * adj);
}
function courseHandicap(hcpIdx, slope, rating, par, allowance, nineHole) {
  return calcPlayingHcp(calcRawCourseHcp(hcpIdx, slope, rating, par, nineHole), allowance);
}
function sfRankOrder(a, b) {
  return ((b.pts - b.quota) - (a.pts - a.quota)) || (b.pts - a.pts);
}
function pointTarget(courseHcp, nineHole) {
  return (nineHole ? 18 : 36) - courseHcp;
}
function effectiveHcpRatings(course, activeHoles) {
  if (!course.nineHole && activeHoles.length === 18) return null;
  const max = Math.max(...activeHoles.map(h => h.hcpRating||h.hcp||0));
  if (max <= 9) return null;
  const sorted = [...activeHoles].sort((a,b) => (a.hcpRating||a.hcp||0) - (b.hcpRating||b.hcp||0));
  const rankMap = {};
  sorted.forEach((h, i) => { rankMap[h.num] = i + 1; });
  return rankMap;
}
function strokesOnHoleHalf(courseHcp, holeHcpRating, hcpScale) {
  return strokesOnHole(courseHcp, holeHcpRating, hcpScale) * 0.5;
}
function skinsEffHcp(courseHcp, lowCH, strokeOffBest) {
  return strokeOffBest ? Math.max(0, courseHcp - lowCH) : courseHcp;
}
function skinsNetOnHole(gross, courseHcp, holeHcpRating, hcpScale, halfStroke) {
  if (!(gross > 0)) return 0;
  const str = halfStroke ? strokesOnHoleHalf(courseHcp, holeHcpRating, hcpScale)
                         : strokesOnHole(courseHcp, holeHcpRating, hcpScale);
  return gross - (halfStroke ? str : Math.floor(str));
}
function stablefordPts(grossVsPar, s) {
  if (grossVsPar <= -3) return s.dblEagle ?? s.ptsDblEagle ?? 8;
  if (grossVsPar === -2) return s.eagle    ?? s.ptsEagle    ?? 4;
  if (grossVsPar === -1) return s.birdie   ?? s.ptsBirdie   ?? 2;
  if (grossVsPar ===  0) return s.par      ?? s.ptsPar      ?? 1;
  if (grossVsPar ===  1) return s.bogey    ?? s.ptsBogey    ?? 0;
  return s.dbl ?? s.ptsDbl ?? 0;
}
function getActiveHoles(course, nineMode) {
  const holes = course.holes || [];
  if (nineMode === 'front') return holes.slice(0, 9);
  if (nineMode === 'back')  return holes.slice(9, 18);
  return holes;
}
function scoreCell(value, strokes, pidAttr, pid, holeNum, handler) {
  const bg  = strokes > 0 ? 'background:#fde8e8;' : strokes < 0 ? 'background:#e8f4ec;' : '';
  const dot = strokes > 0
    ? `<span style="position:absolute;top:1px;right:2px;color:#c0392b;font-size:8px;">${'\u2022'.repeat(Math.min(strokes,3))}</span>`
    : strokes < 0
    ? `<span style="position:absolute;top:1px;right:2px;color:#27ae60;font-size:8px;">${'\u2022'.repeat(Math.min(Math.abs(strokes),3))}</span>`
    : '';
  // No handler = a card to READ (History). It used to stay typeable, and the
  // foursome handler writes to the game IN PROGRESS, so a tap on a finished
  // card changed the live game (found by the walk, 2026-10-03).
  const entry = handler ? `oninput="${handler}"` : 'readonly tabindex="-1"';
  return `<div class="hole-cell" style="position:relative;padding:0;${bg}"><input type="text" inputmode="numeric" maxlength="1" value="${value}" ${pidAttr}="${pid}" data-hole="${holeNum}" ${entry} class="game-score-input">${dot}</div>`;
}
function scorecardHdr(holes, lbl, totLbl, nameColW, totColW, hcpRow) {
  const nw   = nameColW || '80px';
  const tw   = totColW  || '36px';
  const cols = `${nw} repeat(${holes.length},1fr) ${tw}`;
  const parTot = holes.reduce((a, h) => a + h.par, 0);
  let out = `
    <div class="hole-grid" style="grid-template-columns:${cols};">
      <div class="hole-cell" style="background:var(--g800);color:rgba(255,255,255,.5);font-size:9px;font-weight:700;">${lbl}</div>
      ${holes.map(h => `<div class="hole-cell" style="background:var(--g800);color:var(--gold);font-size:10px;font-weight:700;">${h.num}</div>`).join('')}
      <div class="hole-cell" style="background:var(--g800);color:rgba(255,255,255,.5);font-size:9px;font-weight:700;">${totLbl}</div>
    </div>
    <div class="hole-grid" style="grid-template-columns:${cols};">
      <div class="hole-cell header">Par</div>
      ${holes.map(h => `<div class="hole-cell par-cell">${h.par}</div>`).join('')}
      <div class="hole-cell total">${parTot}</div>
    </div>`;
  if (hcpRow) {
    out += `
    <div class="hole-grid" style="grid-template-columns:${cols};">
      <div class="hole-cell header" style="color:var(--muted);">HCP</div>
      ${holes.map(h => `<div class="hole-cell" style="font-size:10px;color:var(--muted);">${h.hcp || ''}</div>`).join('')}
      <div class="hole-cell"></div>
    </div>`;
  }
  return out;
}
function scorecardName(player, groupPlayers) {
  const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  const last = lastNameOf(player.name);
  if (!last) return player.name || '?';
  const sameLastName = groupPlayers.filter(p => p.id !== player.id && lastNameOf(p.name) === last);
  if (!sameLastName.length) return cap(last);
  const first = firstNameOf(player.name) || '';
  const sameInitial = sameLastName.filter(p => (firstNameOf(p.name)||'')[0]?.toLowerCase() === first[0]?.toLowerCase());
  if (!sameInitial.length) return cap(last) + (first ? ', ' + first[0].toUpperCase() + '.' : '');
  return cap(last) + (first ? ', ' + first : '');
}
function scrambleTeamCH(players, course, is9, pcts) {
  if (!players || !players.length || !pcts || !pcts.length) return 0;
  const ranked = [...players]
    .map(p => calcCourseHcp(p.hcp || 0, course.slope || 113, course.rating || 72, coursePar(course), is9))
    .sort((a, b) => a - b);
  const raw = ranked.reduce((sum, ch, i) => sum + ch * (pcts[i] || 0) / 100, 0);
  return Math.round(raw);
}
function bestBallsHoleNet(players, scores, hole, hcpScale) {
  const hr   = hole.hcpRating ?? 0;
  const nets = players.map(p => {
    const gross = parseInt((scores[p.id] || {})[hole.num]) || 0;
    if (!gross) return null;
    return gross - strokesOnHole(p.courseHcp, hr, hcpScale);
  }).filter(v => v !== null).sort((a, b) => a - b);
  return nets.slice(0, 2);
}
function threeTwoOneBestNets(players, scores, hole, hcpScale) {
  const hr   = hole.hcpRating ?? 0;
  const take = hole.par === 3 ? 3 : hole.par === 4 ? 2 : 1;
  const nets = players.map(p => {
    const gross = parseInt((scores[p.id] || {})[hole.num]) || 0;
    if (!gross) return null;
    return gross - strokesOnHole(p.courseHcp, hr, hcpScale);
  }).filter(v => v !== null).sort((a, b) => a - b);
  return nets.slice(0, take);
}
function buildScoringCtx(players, course, nineMode, scores, groups, format, settings) {
  /* A NINE OFF AN 18-HOLE COURSE (trips.js, 2026-10-05). Two things change:
     the holes are re-ranked 1-9 so strokes fall on the nine's hardest holes
     (as outingScoringCtx always did), and the course handicap uses the par of
     the nine PLAYED. The 18-hole par went into the 9-hole formula, which gave
     a 10 handicap -31 on a nine and added ~36 to every 9-hole round. */
  const activeHolesRaw = getActiveHoles(course, nineMode);
  const rankMap        = effectiveHcpRatings(course, activeHolesRaw);
  const activeHoles = activeHolesRaw.map(h => ({
    ...h, hcpRating: rankMap ? (rankMap[h.num] ?? 0) : (h.hcpRating ?? h.hcp ?? 0)
  }));
  const is9             = activeHoles.length === 9;
  const hcpScale        = activeHoles.length || 18;
  const strokeAllowance = (settings && settings.strokeAllowance) || 100;
  const playedPar       = activeHoles.reduce((a, h) => a + (h.par || 0), 0);
  const withCH = (players || []).map(p => ({
    ...p,
    courseHcp: courseHandicap(p.hcp || 0, p.teeSlope ?? (course.slope || 113), p.teeRating ?? (course.rating || 72),
      is9 ? playedPar : (p.teePar ?? coursePar(course)), strokeAllowance, is9)
  }));
  return {
    players: withCH, course, activeHoles, hcpScale, is9, nineMode,
    scores:  scores || {},
    groups:  (groups || []).map((g, i) => ({
      playerIds: g.playerIds || [],
      label:     g.label || g.teetime || g.name || ('Group ' + (i + 1))
    })),
    format:   format || 'stroke',
    settings: settings || {}
  };
}
function outingScoringCtx(g) {
  const course = fsGetCourse(g.courseId); if (!course) return null;
  const nineMode       = g.nineSide || 'all';
  const activeHolesRaw = getActiveHoles(course, nineMode);
  const rankMap        = effectiveHcpRatings(course, activeHolesRaw);
  const activeHoles    = activeHolesRaw.map(h => ({
    ...h, hcpRating: rankMap ? (rankMap[h.num] ?? 0) : (h.hcp ?? 0)
  }));
  const is9      = activeHoles.length === 9;
  const hcpScale = activeHoles.length || 18;
  const players  = (g.players || []).map(p => ({ ...p, courseHcp: p.courseHcp ?? 0 }));
  const scramCfg = S.config.games?.fourPlayer?.scramble || {};
  const pcts     = scramCfg.hcpMethod === 'none' ? [] :
    (scramCfg.abcdPct && scramCfg.abcdPct.length >= players.length ? scramCfg.abcdPct :
      players.length >= 4 ? [100,85,70,60] : players.length === 3 ? [100,85,70] : [100,85]);
  return {
    players, course, activeHoles, hcpScale, is9, nineMode,
    scores:  g.scores || {},
    groups:  (g.groups || []).map((gr, i) => ({
      playerIds: gr.playerIds || [], label: gr.teetime || gr.name || ('Group ' + (i + 1))
    })),
    format:  g.gameType || 'stroke',
    settings: {
      scramblePcts:    pcts,
      strokeAllowance: 100,
      skins:           g.skinsCfg || {},
      sfCfg:           S.config.games?.individual?.stableford || {},
      resultMethod:    g.resultMethod || 'best2',
      borrows:         []
    }
  };
}
function isTeamFormat(fmt) { return TEAM_FORMATS.has(fmt); }
function isCompFormat(fmt) { return COMP_FORMATS.has(fmt); }
function computeRoundResults(ctx) {
  const { players, activeHoles, hcpScale, is9, scores, groups, format, settings } = ctx;
  const sfCfg = settings.sfCfg || {};

  if (format === 'scramble') {
    const pcts   = settings.scramblePcts || [];
    const parTot = activeHoles.reduce((a, h) => a + h.par, 0);
    const entries = groups.map((grp, gi) => {
      const gp    = grp.playerIds.map(id => players.find(p => p.id === id)).filter(Boolean);
      if (!gp.length) return null;
      const key   = `grp_${gi}`;
      const gross = activeHoles.reduce((a, h) => a + (parseInt((scores[key] || {})[h.num]) || 0), 0);
      if (!gross) return null;
      const tCH   = scrambleTeamCH(gp, ctx.course, is9, pcts);
      const net   = gross - tCH;
      // Against par over the holes PLAYED, strokes on those holes only: mid-round
      // the full team handicap came off a few holes (2026-10-05). Finished, it
      // equals net - par.
      let thru = 0, toPar = 0, parThru = 0;
      activeHoles.forEach(h => { const g = parseInt((scores[key] || {})[h.num]) || 0; if (!g) return;
        thru++; parThru += h.par; toPar += g - strokesOnHole(tCH, h.hcpRating || 0, hcpScale) - h.par; });
      return { gi, label: grp.label, names: gp.map(p => (p.name||'').split(',')[0]||p.name).join(' / '),
               gross, teamCH: tCH, net, netVsPar: toPar, thru, netThru: toPar + parThru };
    }).filter(Boolean).sort((a, b) => a.netVsPar - b.netVsPar);
    return { type: 'scramble', entries };
  }

  if (isTeamFormat(format)) {
    const use321  = format === '321' || format === 'threeTwoOne' ||
                    (format === 'shamble' && (settings.resultMethod || 'best2') === '321');
    const borrows = settings.borrows || [];
    const entries = groups.map((grp, gi) => {
      const homePids  = grp.playerIds || [];
      const borrow    = borrows.find(b => b.gi === gi);
      const extraPids = borrow ? borrow.borrowedPids : [];
      const gp = [...homePids, ...extraPids].map(id => players.find(p => p.id === id)).filter(Boolean);
      if (!gp.length) return null;
      const hasAny = gp.some(p => activeHoles.some(h => parseInt((scores[p.id]||{})[h.num]) > 0));
      if (!hasAny) return null;
      // Par counted for the scores actually used on each hole: the target
      // was the whole round's, so two holes in a team stood ~60 under (2026-10-05).
      let teamNet = 0, parEq = 0, thru = 0;
      activeHoles.forEach(h => {
        const nets = use321
          ? threeTwoOneBestNets(gp, scores, h, hcpScale)
          : bestBallsHoleNet(gp, scores, h, hcpScale);
        teamNet += nets.reduce((a, v) => a + v, 0);
        parEq   += h.par * nets.length;
        if (nets.length) thru++;
      });
      const homeNames = homePids.map(id => { const p=players.find(x=>x.id===id); return p?(p.name||'').split(',')[0]:'?'; });
      const xNames    = extraPids.map(id => { const p=players.find(x=>x.id===id); return p?(p.name||'').split(',')[0]+' (B)':'?'; });
      return { gi, label: grp.label, names: [...homeNames,...xNames].join(' / '),
